name: CI/CD

# Pull requests run lint and tests. Merges to main also build the index and image and deploy to
# Cloud Run. GCP access is Workload Identity Federation only: no keys, no secrets, just the
# repository variables that scripts/setup-gcp.sh sets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Fails if the committed extracted records no longer match the raw AARs.
      - run: uv run coa-explorer extract --check

  deploy:
    # Only the main branch deploys, never a pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the OIDC token Workload Identity Federation checks
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SERVICE: coa-explorer
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      # Model names are configuration (see .env.example); the defaults match it.
      GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION || 'global' }}
      GEMINI_ANSWER_MODEL: ${{ vars.GEMINI_ANSWER_MODEL || 'gemini-3.8-flash' }}
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY || 'coa-explorer' }}/coa-explorer:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Build the search index
        run: |
          uv sync --locked --no-dev
          uv run --no-dev coa-explorer index

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 1Gi \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,GEMINI_LOCATION=$GEMINI_LOCATION,GEMINI_ANSWER_MODEL=$GEMINI_ANSWER_MODEL,GEMINI_EMBEDDING_MODEL=$GEMINI_EMBEDDING_MODEL"
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" \
            --region "$REGION" --format 'value(status.url)')
          echo "SERVICE_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Ask the deployed service a question
        run: uv run --no-dev coa-explorer smoke --url "$SERVICE_URL"
