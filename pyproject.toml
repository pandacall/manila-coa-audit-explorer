[project]
name = "coa-explorer"
version = "0.1.0"
description = "Plain-language, cited answers to questions about COA's Annual Audit Reports on the City of Manila, 2020-2024."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.26",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.30",
]

[project.scripts]
coa-explorer = "coa_explorer.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests quote long passages from the AARs verbatim.
"tests/*" = ["E501"]
